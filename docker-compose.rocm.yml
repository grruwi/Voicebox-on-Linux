# OPTIONAL ROCm variant of the audio.cpp engine — NOT needed, Vulkan runs on any card.
# Radeons only: adds a HIP binary (ROCm 10, TheRock) next to the Vulkan one; the switch
# lives in the panel (Generation → General → Backend). Compiled for specific GPUs:
# every extra card = a longer build and ~0.5 GB more, plus ~2.4 GB of ROCm per family.
#
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d --build
# or for good in .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.rocm.yml

services:
  audiocpp:
    build:
      target: rocm
      # Default: RX 9000 + RX 7000. Other cards — families from
      # https://rocm.prereleases.amd.com/tarball-multi-arch/ and their gfx:
      # args:
      #   ROCM_FAMILIES: "gfx103X-all"
      #   GPU_TARGETS: "gfx1030"
    devices:
      - /dev/kfd:/dev/kfd
    # Docker's default seccomp profile blocks some syscalls of the HSA queues
    security_opt:
      - seccomp:unconfined
